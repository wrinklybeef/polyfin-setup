# Adapted from moodiness/polyfin's MIT-licensed compose.embedded.yaml.
# https://github.com/moodiness/polyfin/blob/main/compose.embedded.yaml
name: polyfin

services:
  polyfin:
    image: ghcr.io/moodiness/polyfin:latest
    restart: unless-stopped
    # Use Docker's built-in bridge, avoiding its embedded 127.0.0.11 DNS.
    network_mode: bridge
    environment:
      POLYFIN_DATABASE: embedded
      POLYFIN_SECRET_KEY: ${POLYFIN_SECRET_KEY:?Set POLYFIN_SECRET_KEY in .env}
    ports:
      - "8096:8096"
    volumes:
      - polyfin_data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 1m

volumes:
  polyfin_data:
